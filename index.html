<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification Widget ICOM</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #dce1e7; max-width: 600px; margin: 0 auto; }
        .status { padding: 15px; border-radius: 6px; font-weight: bold; background: #e8f8f5; color: #1e8449; border: 1px solid #a3e4d7; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; border: 1px solid #dce1e7; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Module d'Identification (Modèle ICOM)</h2>
        <div id="status" class="status">En attente de sélection...</div>
        <pre id="details">Aucune ligne sélectionnée</pre>
    </div>

    <script>
        grist.ready({ requiredAccess: 'full' });

        // Modèle exact du widget ICOM : écoute de la ligne active de la table liée
        grist.onRecord(function(record) {
            const statusDiv = document.getElementById('status');
            const detailsPre = document.getElementById('details');
            
            if (record) {
                detailsPre.textContent = JSON.stringify(record, null, 2);
                
                // Recherche des champs d'identification communs (Nom, Email, etc.)
                const nom = record.NomComplet || record.Nom || record.Email || `ID #${record.id}`;
                statusDiv.textContent = `✅ Agent actif détecté : ${nom}`;
            } else {
                statusDiv.style.background = "#fdedec";
                statusDiv.style.color = "#922b21";
                statusDiv.style.borderColor = "#f5b7b1";
                statusDiv.textContent = "⚠️ Aucun enregistrement actif reçu de la vue liée.";
                detailsPre.textContent = "Aucune donnée";
            }
        });
    </script>
</body>
</html>
