<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réservation de Matériel Interne</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 16px; background-color: #f8fafc; font-size: 15.5px; color: #1f2937; }

    .form-card { background: #ffffff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; max-width: 900px; margin: 0 auto; }
    .card-title { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }

    .section-title { font-size: 16px; font-weight: bold; color: #111827; margin-top: 20px; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 2px solid #1f4e78; display: flex; align-items: center; gap: 8px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group.full { grid-column: span 2; }
    
    label { font-size: 13px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.3px; }
    
    input[type="text"], input[type="number"], input[type="datetime-local"], select, textarea { 
      padding: 9.5px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; outline: none; background-color: #fff; width: 100%; transition: all 0.2s; 
    }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }

    textarea { resize: vertical; min-height: 80px; }

    .availability-banner { padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; font-size: 14px; display: none; }
    .avail-ok { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .avail-ko { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    .actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    .btn-submit { background-color: #1f4e78; color: white; border: none; padding: 14px 28px; font-size: 17px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    .btn-submit:hover { background-color: #163856; }
    .btn-submit:disabled { opacity: 0.65; cursor: wait; }

    #debug-box { margin-top: 20px; padding: 12px; background: #fef2f2; border: 1px solid #ef4444; border-radius: 6px; color: #991b1b; font-family: monospace; font-size: 13px; white-space: pre-wrap; display: none; }
    
    .user-badge { background: #e8f4fd; color: #1f4e78; padding: 8px 12px; border-radius: 6px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #b6d4fe; }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="card-title">📦 Réservation de Matériel</div>

    <!-- Encart affichant l'agent transmis par la vue liée Grist -->
    <div id="user-badge" class="user-badge">
      <span>👤 Demandeur actif : <strong id="agent-nom">En attente de sélection...</strong></span>
      <span id="role-referent-tag" style="display:none; background:#1f4e78; color:#fff; padding:2px 8px; border-radius:4px; font-size:12px;">Référent</span>
    </div>

    <form id="loan-form" onsubmit="enregistrerPret(event)">
      
      <div class="section-title">🛠️ Choix de l'équipement</div>
      
      <div class="grid-2">
        <div class="field-group">
          <label>Filtrer par catégorie</label>
          <select id="filter-categorie" onchange="filtrerMateriel()">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
        <div class="field-group">
          <label>Matériel souhaité *</label>
          <select id="select-materiel" required onchange="verifierDisponibilite()">
            <option value="">-- Sélectionnez un équipement --</option>
          </select>
        </div>
      </div>

      <div class="grid-3" style="display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 16px; margin-bottom: 12px;">
        <div class="field-group">
          <label>Quantité *</label>
          <input type="number" id="quantite-demande" min="1" value="1" required oninput="verifierDisponibilite()">
        </div>
        <div class="field-group">
          <label>Date et heure de début *</label>
          <input type="datetime-local" id="debut-pret" required onchange="verifierDisponibilite()">
        </div>
        <div class="field-group">
          <label>Date et heure de fin *</label>
          <input type="datetime-local" id="fin-pret" required onchange="verifierDisponibilite()">
        </div>
      </div>

      <div id="availability-box" class="availability-banner"></div>

      <div class="section-title">📝 Contexte de la demande</div>
      <div class="field-group full">
        <label>Motif / Détails de l'emprunt *</label>
        <textarea id="details-demande" placeholder="Précisez l'événement, le lieu ou l'usage..." required></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-submit" id="submit-btn">✔ Soumettre la demande de prêt</button>
      </div>

      <div id="debug-box"></div>
    </form>
  </div>

  <script>
    grist.ready({ requiredAccess: 'full' });

    let currentUserId = null;
    let isReferent = false;
    let catalogMateriel = [];
    let recordsPrets = [];

    // 1. Liaison ICOM : Le widget écoute l'agent sélectionné dans la vue parente (table Utilisateurs)
    grist.onRecord(function(record) {
      const nomSpan = document.getElementById('agent-nom');
      const badgeReferent = document.getElementById('role-referent-tag');

      if (record && record.id) {
        currentUserId = record.id;
        const nomComplet = record.NomComplet || record.Email || `Agent #${record.id}`;
        isReferent = Boolean(record.ReferentMateriel);

        nomSpan.textContent = nomComplet;
        if (isReferent) {
          badgeReferent.style.display = 'inline-block';
        } else {
          badgeReferent.style.display = 'none';
        }
      } else {
        currentUserId = null;
        nomSpan.textContent = "Aucun agent sélectionné (Veuillez sélectionner votre ligne dans la table Utilisateurs au-dessus)";
        badgeReferent.style.display = 'none';
      }
    });

    // 2. Écoute de la table des prêts pour le calcul des stocks en temps réel
    grist.onRecords(function(records) {
      recordsPrets = records || [];
      verifierDisponibilite();
    });

    async function initialiserCatalogue() {
      try {
        const tables = await grist.docApi.listTables();

        if (tables.includes('MATERIEL')) {
          const rawMat = await grist.docApi.fetchTable('MATERIEL');
          const ids = rawMat.id || [];
          
          catalogMateriel = ids.map((id, index) => {
            return {
              id,
              IdMateriel: rawMat.IdMateriel ? String(rawMat.IdMateriel[index]) : '',
              Materiel: rawMat.Materiel ? String(rawMat.Materiel[index]) : '',
              Categorie: rawMat.Categorie ? String(rawMat.Categorie[index]) : '',
              Quantite: rawMat.Quantite !== undefined && rawMat.Quantite[index] !== null ? Number(rawMat.Quantite[index]) : 1
            };
          });

          peuplerFiltresEtSelects();
        }
      } catch (err) {
        console.error("Erreur lors du chargement du matériel :", err);
      }
    }

    initialiserCatalogue();

    function peuplerFiltresEtSelects() {
      const catSelect = document.getElementById('filter-categorie');
      const matSelect = document.getElementById('select-materiel');
      
      const categories = [...new Set(catalogMateriel.map(m => m.Categorie).filter(Boolean))].sort();
      
      catSelect.replaceChildren();
      catSelect.appendChild(new Option('Toutes les catégories', ''));
      categories.forEach(cat => catSelect.appendChild(new Option(cat, cat)));

      mettreAJourSelectMateriel(catalogMateriel);
    }

    function filtrerMateriel() {
      const cat = document.getElementById('filter-categorie').value;
      const filtered = cat ? catalogMateriel.filter(m => m.Categorie === cat) : catalogMateriel;
      mettreAJourSelectMateriel(filtered);
    }

    function mettreAJourSelectMateriel(items) {
      const matSelect = document.getElementById('select-materiel');
      matSelect.replaceChildren();
      matSelect.appendChild(new Option('-- Sélectionnez un équipement --', ''));

      items.forEach(m => {
        const prefix = m.IdMateriel ? `[${m.IdMateriel}] ` : '';
        const label = `${prefix}${m.Materiel} (Stock total : ${m.Quantite})`;
        matSelect.appendChild(new Option(label, m.id));
      });
      verifierDisponibilite();
    }

    function parseGristDate(val) {
      if (!val) return null;
      if (typeof val === 'number') return val < 10000000000 ? val * 1000 : val;
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d.getTime();
    }

    function verifierDisponibilite() {
      const banner = document.getElementById('availability-box');
      const submitBtn = document.getElementById('submit-btn');
      const matId = Number(document.getElementById('select-materiel').value);
      const qteDemandee = parseInt(document.getElementById('quantite-demande').value) || 1;
      const debutVal = document.getElementById('debut-pret').value;
      const finVal = document.getElementById('fin-pret').value;

      if (!matId || !debutVal || !finVal) {
        banner.style.display = 'none';
        submitBtn.disabled = false;
        return;
      }

      const debutMs = new Date(debutVal).getTime();
      const finMs = new Date(finVal).getTime();

      if (debutMs >= finMs) {
        banner.style.display = 'block';
        banner.className = 'availability-banner avail-ko';
        banner.textContent = "⚠️ La date de début doit être antérieure à la date de fin.";
        submitBtn.disabled = true;
        return;
      }

      const item = catalogMateriel.find(m => m.id === matId);
      if (!item) return;

      // Calcul du stock déjà emprunté sur la même période
      let qteEmprunteEspace = 0;
      recordsPrets.forEach(p => {
        if (Number(p.Materiel) !== matId) return;
        const statut = String(p.Statut || 'En attente');
        if (statut === 'Refusé' || statut === 'Clôturé') return;

        const pDebut = parseGristDate(p.DebutPret);
        const pFin = parseGristDate(p.FinPret);
        if (!pDebut || !pFin) return;

        // Intersection de créneaux
        if (debutMs < pFin && finMs > pDebut) {
          qteEmprunteEspace += (Number(p.Quantite) || 1);
        }
      });

      const disponible = Math.max(0, item.Quantite - qteEmprunteEspace);

      banner.style.display = 'block';
      if (disponible === 0) {
        banner.className = 'availability-banner avail-ko';
        banner.textContent = `❌ Aucun exemplaire disponible sur ce créneau (0 / ${item.Quantite} libre).`;
        submitBtn.disabled = true;
      } else if (disponible < qteDemandee) {
        banner.className = 'availability-banner avail-ko';
        banner.textContent = `❌ Stock insuffisant : seulement ${disponible} exemplaire(s) disponible(s) pour ce créneau.`;
        submitBtn.disabled = true;
      } else {
        banner.className = 'availability-banner avail-ok';
        banner.textContent = `✅ Matériel disponible : ${disponible} exemplaire(s) libre(s) sur ${item.Quantite}.`;
        submitBtn.disabled = false;
      }
    }

    async function enregistrerPret(event) {
      event.preventDefault();
      const debugBox = document.getElementById('debug-box');
      debugBox.style.display = 'none';

      if (!currentUserId) {
        alert("Veuillez d'abord sélectionner votre profil dans la table Utilisateurs au-dessus.");
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Enregistrement en cours…';

      const payload = {
        Materiel: Number(document.getElementById('select-materiel').value),
        Quantite: Number(document.getElementById('quantite-demande').value),
        Demandeur: currentUserId,
        DateDemande: new Date().toISOString().split('T')[0],
        DebutPret: new Date(document.getElementById('debut-pret').value).toISOString(),
        FinPret: new Date(document.getElementById('fin-pret').value).toISOString(),
        DetailsDemande: document.getElementById('details-demande').value.trim(),
        Statut: 'En attente'
      };

      try {
        await grist.docApi.applyUserActions([
          ['AddRecord', 'PRET_MATERIEL', -1, payload]
        ]);

        alert('Demande de prêt enregistrée avec succès !');
        document.getElementById('loan-form').reset();
        document.getElementById('quantite-demande').value = 1;
        document.getElementById('availability-box').style.display = 'none';
      } catch (err) {
        console.error("Erreur Grist :", err);
        debugBox.style.display = 'block';
        debugBox.innerText = "❌ ERREUR GRIST :\n" + (err.message || JSON.stringify(err, null, 2));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '✔ Soumettre la demande de prêt';
      }
    }
  </script>
</body>
</html>
