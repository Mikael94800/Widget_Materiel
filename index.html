<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Authentification ICOM</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #dce1e7; }
        .success { background: #e8f8f5; color: #1e8449; padding: 12px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Test de Liaison ICOM</h2>
        <div id="status" class="success">En attente de sélection d'un agent dans Grist...</div>
        <pre id="details" style="background:#f8f9fa; padding:10px; margin-top:15px; font-size:12px;"></pre>
    </div>

    <script>
        grist.ready({ requiredAccess: 'full' });

        // C'est exactement cette méthode qui fonctionnait pour vos cartes ICOM :
        grist.onRecord(function(record) {
            const status = document.getElementById('status');
            const details = document.getElementById('details');
            
            if (record) {
                details.textContent = JSON.stringify(record, null, 2);
                const nom = record.NomComplet || record.Email || record.id;
                status.textContent = `✅ Agent actif détecté : ${nom}`;
            } else {
                status.textContent = "⚠️ Aucun enregistrement sélectionné. Vérifiez que le widget est lié à la table Utilisateurs.";
            }
        });
    </script>
</body>
</html>
